<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    <title>Raiane Leite | Links Oficiais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================
         MODAL +18 (preservado integralmente)
         ============================================ -->
    <div id="age-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <div class="modal-container">
            <button class="modal-close-btn" id="modal-close" aria-label="Fechar modal" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-content">
                <div id="modal-title">✦</div>
                <h2 class="modal-subtitle">AQUI É SÓ O COMEÇO...</h2>
                <p class="modal-description">
                    Este link pode conter conteúdo explícito ou destinado exclusivamente a maiores de 18 anos.
                </p>
                <button class="modal-btn modal-btn-primary" id="modal-confirm" type="button">
                    ✓
                    Tenho 18 anos ou mais
                </button>
                <button class="modal-btn modal-btn-secondary" id="modal-cancel" type="button">
                    Voltar
                </button>
                <div class="modal-footer-note">
                    <span>♡</span>
                    <p>Ao continuar, você confirma ter 18 anos ou mais.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================
         CAMADA DE FUNDO — IMAGEM
         ============================================ -->
    <div class="bg-image-layer" role="img" aria-label="Fotografia de Raiane Leite"></div>

    <!-- ============================================
         CAMADA DE ESCURECIMENTO
         ============================================ -->
    <div class="bg-overlay"></div>

    <!-- ============================================
         CONTEÚDO PRINCIPAL
         ============================================ -->
    <main class="main-container">

        <!-- Cabeçalho -->
        <header class="page-header">
            <h1 class="creator-name">Raiane Leite</h1>
            <p class="creator-tagline">A melhor parte fica aqui 🔥</p>
        </header>

        <!-- Container dos Cards (JS injeta aqui) -->
        <section class="cards-section" aria-label="Links oficiais">
            <div id="cards-container" class="cards-list"></div>
        </section>

        <!-- Mensagem fallback (preservada) -->
        <noscript>
            <p class="noscript-message">Ative o JavaScript para visualizar todos os links.</p>
        </noscript>

    </main>

    <!-- Scripts (preservados) -->
    <script src="main.js"></script>

</body>
</html>
